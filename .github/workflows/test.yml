name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every tests/check-*.js must pass; check-live-reload.js prints SKIP without DR7_LIVE=1 (needs Photoshop).
      - name: Run checks
        run: |
          status=0
          for t in tests/check-*.js; do
            echo "::group::$t"
            node "$t" || { echo "::error::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
