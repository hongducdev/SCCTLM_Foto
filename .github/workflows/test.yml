name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every tests/check-*.js must pass (tests/run-checks.js); check-live-reload.js prints SKIP without SCCTLM_FOTO_LIVE=1 (needs Photoshop).
      - name: Run checks
        run: npm test
