name: release

# Push a tag like v0.1.8 (after bumping CSXS/manifest.xml and docs/project-changelog.md) to publish the release.
# The in-panel updater reads release-manifest.json (signed offline with scripts/release-sign.js) from raw files at the tag,
# so it never touches the attached zip. The zip is for manual installs and makes GitHub count downloads per release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(grep -oP 'ExtensionBundleVersion="\K[^"]+' CSXS/manifest.xml)
          extension=$(grep -oP '<Extension [^>]*Version="\K[^"]+' CSXS/manifest.xml)
          if [ "$version" != "$manifest" ] || [ "$version" != "$extension" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest (bundle $manifest, extension $extension)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signed release manifest
        run: node scripts/release-verify.js
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## v$version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' docs/project-changelog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no 'v$version' section in docs/project-changelog.md"
            exit 1
          fi
          cat notes.md
      - name: Build install zip
        run: git archive --format=zip --prefix=SCCTLM_Foto/ -o "SCCTLM_Foto-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" "SCCTLM_Foto-${GITHUB_REF_NAME}.zip" --verify-tag --title "SCCTLM_Foto ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
